name: Build and release

# Bouwt platformspecifieke wheels en maakt een CONCEPT-release aan.
# Het concept publiceer je handmatig na controle van de release-notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Leestoegang tot de private epynet-repository via een deploy key.
      # De sleutel staat als secret EPYNET_DEPLOY_KEY in de NzingaFlow-repository.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EPYNET_DEPLOY_KEY }}

      - name: Install EPYnetDTD (private)
        run: python -m pip install "epynet @ git+ssh://git@github.com/<org>/epynet.git@v2.0.0"

      - name: Install NzingaFlow with dev tools
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Build sdist (once)
        if: matrix.os == 'ubuntu-latest'
        run: python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --title "NzingaFlow ${{ github.ref_name }}"
          --draft --generate-notes
