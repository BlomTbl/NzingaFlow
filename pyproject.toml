[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nzingaflow"
version = "1.3.1"
description = "Lagrangian Transport kwaliteitssimulator voor EPANET-drinkwaternetwerken"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "NzingaFlow" },
]
keywords = [
    "water quality",
    "EPANET",
    "Lagrangian transport",
    "drinking water",
    "LTA",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    # >=2.0 == EPYnetDTD (kale Network + epynet.solver.HydraulicSolver,
    # epynet.enum). NzingaFlow gebruikt geen epynet.compat — dat bestaat niet
    # (meer); HydraulicModel implementeert sessie-hergebruik en memoisatie
    # zelf (zie hydraulics.py::_NoSaveHydraulicSolver). Vanaf NzingaFlow
    # 1.3.0 is de oude epynet (<2.0, met Network.solve(simtime=...)/
    # .ep-shim) niet meer ondersteund — zie CHANGELOG.md.
    # LET OP: epynet>=2.0 staat niet op PyPI; eerst vanuit broncode installeren
    # (zie README, Installatie), anders kan pip deze afhankelijkheid niet oplossen.
    "epynet>=2.0",
]

[project.optional-dependencies]
numba = [
    "numba>=0.57",
]
geochem = [
    "phreeqpython>=1.4",
]
msx = [
    "scipy>=1.10",   # alleen voor de solvers 'rk45' en 'radau' in MsxReactionSystem
]
pandas = [
    "pandas>=1.5",   # alleen voor MsxSimulationResult.to_dataframe()
]
dev = [
    "pytest>=7.0",
    "scipy>=1.10",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = [
    "nzingaflow[numba,geochem,msx,pandas,dev]",
]

[project.urls]
Homepage       = "https://github.com/nzingaflow/nzingaflow"
Repository     = "https://github.com/nzingaflow/nzingaflow"
Issues         = "https://github.com/nzingaflow/nzingaflow/issues"
Documentation  = "https://github.com/nzingaflow/nzingaflow#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["nzingaflow*"]

[tool.setuptools.package-data]
nzingaflow = [
    "py.typed",
    "lib/*.so",
    "lib/*.dylib",
    "lib/*.dll",
    "lib/README.txt",
]

# ── Ruff linter ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown (README-codeblokken) niet door ruff laten formatteren: de kopieën in
# nzingaflow/documentation/ moeten identiek blijven aan de README's in de root.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long (docstrings)
    "E741",   # ambiguous variable name (l, O, I — ok in wetenschappelijke code)
]

[tool.ruff.lint.per-file-ignores]
# pytest: een fixture importeren en daarna als parameter gebruiken geeft F811;
# importorskip vóór de imports van optionele pakketten geeft E402. Beide zijn bedoeld.
"tests/*" = ["F811", "E402"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # epynet heeft geen stubs

# Bekende, bewust gedocumenteerde uitzonderingen (geen stille wildcard):
#
# lta, merging: numba. `njit` en de numba-Dispatcher-objecten zijn voor mypy
#   onleesbaar (no-redef bij de optionele import, assignment bij het kiezen van
#   de kernel, no-any-return omdat gecompileerde functies Any teruggeven).
#
# geochemistry, solver: arrays en phreeqpython-objecten worden in __init__ op None
#   gezet en pas bij de eerste solve/init gevuld. mypy ziet die volgorde niet
#   (index, attr-defined, union-attr, arg-type). Oplossing op termijn: de
#   attributen laten ontstaan in __init__, of een _require()-helper per attribuut.
[[tool.mypy.overrides]]
module = ["nzingaflow.lta", "nzingaflow.merging"]
disable_error_code = ["no-redef", "assignment", "no-any-return"]

[[tool.mypy.overrides]]
module = ["nzingaflow.geochemistry", "nzingaflow.solver"]
disable_error_code = [
    "index", "attr-defined", "union-attr", "arg-type",
    "no-any-return", "dict-item",
]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = [
    "slow: tests die > 5 seconden duren",
    "requires_epynet: tests die een geladen EPANET-netwerk vereisen",
    "requires_msx: tests die de epanetmsx/epanet2 gedeelde bibliotheken vereisen",
]